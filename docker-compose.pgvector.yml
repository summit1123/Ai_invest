services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_invest_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: summit
      POSTGRES_PASSWORD: ehdgusdl11!
      POSTGRES_DB: ai_invest
    ports:
      - "5432:5432"
    volumes:
      - ai_invest_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U summit -d ai_invest"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  ai_invest_pgdata:
