    finance_tax_agent:
      model: gpt-5.2
      api_style: responses
      temperature: 0.1
      reasoning_effort: xhigh
    governance_secretary:
      model: gpt-5-nano
      api_style: responses
      temperature: 0.2
      reasoning_effort: medium
    strategy_coordinator:
      model: gpt-5.2
      api_style: responses
      temperature: 0.2
      reasoning_effort: xhigh
    governance_coordinator:
      model: gpt-5.2
      api_style: responses
