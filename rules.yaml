fees:
  source: upbit_orders_chance
  fallback_ask_fee_bps: 5.0
  fallback_bid_fee_bps: 5.0
  refresh_interval_sec: 300
risk:
  min_hold_seconds: 300
  max_daily_loss_pct: 1.5
  max_weekly_loss_pct: 4.0
  max_risk_per_trade_pct: 0.35
  max_total_exposure_pct: 100.0
  max_position_pct_per_symbol: 100.0
  cooldown_minutes_after_trigger: 180
  consecutive_loss_cooldown_count: 3
paper:
  initial_cash_krw: 10000000
regime:
  blocked:
  - HIGH_VOL
  - DATA_UNSTABLE
  trade_allowed:
  - TREND
  trend_adx_min: 25
  volatility_block_atr_pct: 2.5
signal:
  rsi_min: 50
  donchian_window: 20
  timeframe_entry: 15m
  timeframe_context: 1h
  volume_zscore_min: 1.2
  trend_follow_enabled: true
version: v1.0
workers:
  ops_interval_sec: 7200
  risk_interval_sec: 7200
  quant_interval_sec: 7200
  research_interval_sec: 7200
research:
  web_search:
    limit: 8
    enabled: true
    provider: auto
    timeout_sec: 10
  headline_limit: 14
  rss_timeout_sec: 12
strategy:
  alpha_score:
    enabled: true
    ema_fast: 20
    ema_slow: 60
    exit_rsi: 45
    atr_ref_pct: 1.3
    entry_alpha: 0.75
    strong_alpha: 0.65
    atr_block_pct: 2.5
    ret_long_mins: 60
    rev_vol_z_min: 1.3
    stop_atr_mult: 1.1
    vol_scale_max: 1.2
    vol_scale_min: 0.5
    max_target_pct: 3.5
    mom_weight_ret: 0.4
    mom_weight_rsi: 0.2
    mom_weight_vol: 0.15
    ret_short_mins: 15
    trail_atr_mult: 0.9
    base_target_pct: 2.0
    rev_ret_15m_max: -0.008
    rev_rsi_now_min: 50
    cooldown_minutes: 152
    lookback_minutes: 240
    mom_weight_trend: 0.25
    rev_rsi_prev_max: 32
    entry_alpha_fee_k: 0.02
    entry_alpha_spread_k: 0.015
    time_stop_mom_minutes: 240
    time_stop_rev_minutes: 120
    cooldown_override_alpha: 0.8
    cooldown_override_enabled: true
    rev_penalty_when_trend_weak: 0.8
    daily_loss_entry_block_ratio: 0.8
universe:
  mode: paper
  market: upbit
  dynamic:
    enabled: true
    max_candidates: 12
    quote_currency: KRW
    exclude_symbols: []
    include_symbols: []
    min_24h_turnover_krw: 5000000000
    top_n_by_24h_turnover: 40
    enforce_static_allowlist: false
  symbols:
  - KRW-BTC
  - KRW-ETH
  - KRW-XRP
  - KRW-SOL
  trade_side: long_only
  max_open_positions: 1
execution:
  order_style: limit_post_only_first
  min_order_krw: 10000
  default_ord_type: limit
  max_reprice_count: 3
  fallback_to_market: false
  max_submit_retries: 2
  reprice_interval_sec: 8
  cancel_on_timeout_sec: 90
  default_time_in_force: post_only
  post_only_timeout_sec: 30
ops_guard:
  max_data_lag_sec: 3
  max_clock_skew_ms: 1500
  pause_on_recon_fail: true
  max_fill_latency_sec: 45
  pause_on_rest_429_5m: 8
  pause_on_ws_reconnects_5m: 5
reporting:
  weekly_review_day: SUN
  daily_review_time_kst: '23:10'
  weekly_review_time_kst: '21:00'
as_of_date: '2026-02-09'
cost_guard:
  max_total_cost_bps: 18.0
  max_spread_bps_entry: 8.0
  entry_cost_buffer_bps: 5.0
  min_expected_edge_bps: 28.0
  max_predicted_slippage_bps: 10.0
governance:
  micro_mode:
    enabled: true
    min_alpha: 0.85
    entry_mode: adaptive
    max_spread_bps: 1.165
    plan_hold_only: true
    max_position_pct: 100.0
    max_daily_loss_pct: 0.5
    max_trades_per_day: 10
    require_market_long: false
    allow_plan_led_entry: true
    realtime_max_spread_mult: 1.15
    realtime_min_alpha_delta: -0.08
    realtime_between_meetings: true
    realtime_symbol_max_age_min: 180
    ignore_market_edge_in_plan_led: true
    ignore_market_cooldown_in_plan_led: true
  capital_policy:
    tiers:
    - name: seed_small
      min_equity_krw: 0
      max_target_position_pct: 100.0
      max_position_pct_per_symbol: 100.0
      cooldown_minutes_after_trigger: 240
    - name: core
      min_equity_krw: 3000000
      max_target_position_pct: 100.0
      max_position_pct_per_symbol: 100.0
      cooldown_minutes_after_trigger: 180
    - name: expanded
      min_equity_krw: 10000000
      max_target_position_pct: 100.0
      max_position_pct_per_symbol: 100.0
      cooldown_minutes_after_trigger: 120
    enabled: true
  activation_gate:
    enabled: true
    max_drawdown_pct: 25.0
    min_win_rate_pct: 40.0
    min_backtest_score: 0.0
    min_backtest_trades: 3
    require_symbol_match: false
    conditional_activation:
      enabled: true
      promotion:
        promotion_ttl_minutes: 120
        target_position_pct_cap: 100.0
        cooldown_after_promotion_minutes: 60
      conditions:
        min_alpha: 0.75
        min_vol_z: 0.0
        min_atr_pct: 0.08
        max_spread_bps: 1.5
        sustain_seconds: 180
        min_pass_conditions: 3
      auto_promote_to: PAPER
    live_execution_enabled: false
  catchup_enabled: true
  plan_continuity:
    enabled: true
    min_hold_minutes: 152
    sticky_if_position_open: true
    switch_min_backtest_score_delta: 2.0
    switch_min_candidate_score_delta: 0.15
  learning_context:
    meeting_memory:
      enabled: true
      max_sessions: 6
      lookback_days: 14
      summary_max_chars: 280
    outcome_windows:
      short_days: 14
      anchor_days: 270
      medium_days: 90
      execution_hours: 6
    max_outcome_rows: 6000
    recent_window_fallback_min_trades: 5
  meeting_window_min: 3
  prework_max_age_min: 90
  llm_call_timeout_sec: 90
  protocol_timeout_sec: 900
  catchup_lookback_hours: 36
  daily_meeting_times_kst:
  - 00:05
  - 02:05
  - 04:05
  - 06:05
  - 08:05
  - '10:05'
  - '12:05'
  - '14:05'
  - '16:05'
  - '18:05'
  - '20:05'
  - '22:05'
  require_prework_reports: true
  max_open_meeting_minutes: 20
  meeting_on_the_hour_only: false
  default_target_position_pct: 100.0
  prework_refresh_cooldown_min: 3
paper_mode:
  data_collection:
    enabled: true
    force_plan_target_pct: 100.0
    force_plan_buy_allowed: true
    relaxed_min_win_rate_pct: 25.0
    relaxed_min_profit_factor: 1.05
    min_trades_for_strict_gate: 4
    relaxed_min_backtest_score: -1.5
    relaxed_min_expectancy_pct: 0.0
    allow_soft_plan_block_bypass: true
scheduling:
  candle_timeframes:
  - 1m
  - 15m
  - 1h
  decision_interval_sec: 30
settlement:
  timezone: Asia/Seoul
stop_policy:
  mode: atr_with_hard_stop
  atr_window: 14
  atr_stop_mult: 2.2
  hard_stop_pct: 1.2
  atr_trail_mult: 2.8
  time_stop_minutes: 360
  break_even_after_rr: 1.0
  take_profit_partial_pct: 1.8
  include_fee_in_realtime_stop: true
  include_tax_in_realtime_stop: false
resume_policy:
  check_interval_sec: 20
  min_stable_duration_sec: 300
  recon_ok_streak_required: 3
  auto_resume_blocked_reasons:
  - RECON_FAIL
  - DAILY_LOSS
  - MANUAL
quant_backtest:
  hold_bars: 24
  fill_ratio: 0.92
  lookback_bars: 1200
  base_slippage_bps: 1.0
  spread_penalty_mult: 0.3
  low_liquidity_penalty_bps: 1.2
adaptive_tuning:
  bounds:
    governance.micro_mode.min_alpha:
    - 0.1
    - 0.85
    strategy.alpha_score.entry_alpha:
    - 0.2
    - 0.75
    governance.micro_mode.max_spread_bps:
    - 1.0
    - 15.0
    strategy.alpha_score.cooldown_minutes:
    - 5
    - 240
    governance.plan_continuity.min_hold_minutes:
    - 30
    - 360
  enabled: true
  windows:
    short_days: 14
    anchor_days: 270
    medium_days: 90
    execution_hours: 6
  interval_sec: 3600
  max_step_pct: 8.0
  align_to_clock: true
  regime_weights:
    CHOP:
      short: 0.35
      anchor: 0.15
      medium: 0.25
      execution: 0.25
    SHOCK:
      short: 0.25
      anchor: 0.35
      medium: 0.2
      execution: 0.2
    TREND:
      short: 0.3
      anchor: 0.15
      medium: 0.2
      execution: 0.35
  rollback_guard:
    enabled: true
    baseline_hours: 72
    ev_degrade_ratio: 0.2
    check_after_hours: 24
    drawdown_degrade_ratio: 0.3
  whitelist_paths:
  - strategy.alpha_score.entry_alpha
  - strategy.alpha_score.cooldown_minutes
  - governance.micro_mode.min_alpha
  - governance.micro_mode.max_spread_bps
  - governance.plan_continuity.min_hold_minutes
  min_apply_interval_hours: 6
  target_trades_in_execution_window: 6
  preserve_exploration_on_low_activity: true
