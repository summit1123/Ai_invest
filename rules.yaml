version: v1.0
as_of_date: '2026-02-09'
universe:
  market: upbit
  symbols:
  - KRW-BTC
  - KRW-ETH
  - KRW-XRP
  - KRW-SOL
  dynamic:
    enabled: true
    enforce_static_allowlist: false
    quote_currency: KRW
    top_n_by_24h_turnover: 40
    max_candidates: 12
    min_24h_turnover_krw: 5000000000
    include_symbols: []
    exclude_symbols: []
  trade_side: long_only
  mode: paper
  max_open_positions: 1
paper:
  initial_cash_krw: 10000000
scheduling:
  decision_interval_sec: 15
  candle_timeframes:
  - 1m
  - 15m
  - 1h
workers:
  research_interval_sec: 3600
  quant_interval_sec: 3600
  risk_interval_sec: 3600
  ops_interval_sec: 3600
quant_backtest:
  lookback_bars: 1200
  hold_bars: 24
  base_slippage_bps: 1.0
  spread_penalty_mult: 0.3
  low_liquidity_penalty_bps: 1.2
  fill_ratio: 0.92
strategy:
  alpha_score:
    enabled: true
    entry_alpha: 0.6197
    strong_alpha: 0.65
    cooldown_override_alpha: 0.8
    cooldown_override_enabled: true
    base_target_pct: 2.0
    max_target_pct: 3.5
    atr_ref_pct: 1.3
    vol_scale_min: 0.5
    vol_scale_max: 1.2
    ema_fast: 20
    ema_slow: 60
    ret_short_mins: 15
    ret_long_mins: 60
    lookback_minutes: 240
    rev_rsi_prev_max: 32
    rev_rsi_now_min: 50
    rev_ret_15m_max: -0.008
    rev_vol_z_min: 1.3
    exit_rsi: 45
    stop_atr_mult: 1.1
    trail_atr_mult: 0.9
    time_stop_mom_minutes: 240
    time_stop_rev_minutes: 120
    cooldown_minutes: 44
    atr_block_pct: 2.5
    daily_loss_entry_block_ratio: 0.8
    mom_weight_rsi: 0.2
    mom_weight_vol: 0.15
    mom_weight_ret: 0.4
    mom_weight_trend: 0.25
    rev_penalty_when_trend_weak: 0.8
    entry_alpha_spread_k: 0.015
    entry_alpha_fee_k: 0.02
paper_mode:
  data_collection:
    enabled: true
    min_trades_for_strict_gate: 4
    relaxed_min_win_rate_pct: 25.0
    relaxed_min_backtest_score: -1.5
    relaxed_min_profit_factor: 1.05
    relaxed_min_expectancy_pct: 0.0
    force_plan_buy_allowed: true
    force_plan_target_pct: 5.0
governance:
  meeting_on_the_hour_only: true
  daily_meeting_times_kst:
  - 00:00
  - 01:00
  - 02:00
  - 03:00
  - 04:00
  - 05:00
  - 06:00
  - 07:00
  - 08:00
  - 09:00
  - '10:00'
  - '11:00'
  - '12:00'
  - '13:00'
  - '14:00'
  - '15:00'
  - '16:00'
  - '17:00'
  - '18:00'
  - '19:00'
  - '20:00'
  - '21:00'
  - '22:00'
  - '23:00'
  prework_max_age_min: 90
  prework_refresh_cooldown_min: 5
  require_prework_reports: true
  meeting_window_min: 5
  catchup_enabled: true
  catchup_lookback_hours: 36
  plan_continuity:
    enabled: true
    sticky_if_position_open: true
    min_hold_minutes: 267
    switch_min_backtest_score_delta: 2.0
    switch_min_candidate_score_delta: 0.15
  micro_mode:
    enabled: true
    entry_mode: adaptive
    plan_hold_only: true
    allow_plan_led_entry: true
    require_market_long: false
    max_position_pct: 2.0
    max_spread_bps: 2.614
    min_alpha: 0.2756
    max_daily_loss_pct: 0.5
    max_trades_per_day: 5
  default_target_position_pct: 10.0
  activation_gate:
    enabled: true
    live_execution_enabled: false
    conditional_activation:
      enabled: true
      auto_promote_to: PAPER
      conditions:
        min_alpha: 0.75
        max_spread_bps: 1.5
        min_vol_z: 0.0
        min_atr_pct: 0.08
        sustain_seconds: 180
        min_pass_conditions: 3
      promotion:
        target_position_pct_cap: 3.0
        cooldown_after_promotion_minutes: 60
        promotion_ttl_minutes: 120
    require_symbol_match: true
    min_backtest_trades: 3
    min_win_rate_pct: 40.0
    min_backtest_score: 0.0
    max_drawdown_pct: 25.0
  capital_policy:
    enabled: true
    tiers:
    - name: seed_small
      min_equity_krw: 0
      max_target_position_pct: 6.0
      max_position_pct_per_symbol: 12.0
      cooldown_minutes_after_trigger: 240
    - name: core
      min_equity_krw: 3000000
      max_target_position_pct: 10.0
      max_position_pct_per_symbol: 18.0
      cooldown_minutes_after_trigger: 180
    - name: expanded
      min_equity_krw: 10000000
      max_target_position_pct: 12.0
      max_position_pct_per_symbol: 20.0
      cooldown_minutes_after_trigger: 120
adaptive_tuning:
  enabled: true
  interval_sec: 3600
  align_to_clock: true
  max_step_pct: 10.0
  target_trades_in_execution_window: 3
  windows:
    execution_hours: 6
    short_days: 14
    medium_days: 90
    anchor_days: 270
  regime_weights:
    TREND:
      execution: 0.35
      short: 0.3
      medium: 0.2
      anchor: 0.15
    CHOP:
      execution: 0.25
      short: 0.35
      medium: 0.25
      anchor: 0.15
    SHOCK:
      execution: 0.2
      short: 0.25
      medium: 0.2
      anchor: 0.35
  whitelist_paths:
  - strategy.alpha_score.entry_alpha
  - strategy.alpha_score.cooldown_minutes
  - governance.micro_mode.min_alpha
  - governance.micro_mode.max_spread_bps
  - governance.plan_continuity.min_hold_minutes
  bounds:
    strategy.alpha_score.entry_alpha:
    - 0.15
    - 0.9
    strategy.alpha_score.cooldown_minutes:
    - 5
    - 720
    governance.micro_mode.min_alpha:
    - 0.1
    - 0.95
    governance.micro_mode.max_spread_bps:
    - 0.5
    - 15.0
    governance.plan_continuity.min_hold_minutes:
    - 30
    - 1440
  rollback_guard:
    enabled: true
    check_after_hours: 24
    baseline_hours: 72
    ev_degrade_ratio: 0.2
    drawdown_degrade_ratio: 0.3
execution:
  order_style: limit_post_only_first
  default_ord_type: limit
  default_time_in_force: post_only
  post_only_timeout_sec: 30
  reprice_interval_sec: 8
  max_reprice_count: 3
  fallback_to_market: false
  min_order_krw: 10000
  max_submit_retries: 2
  cancel_on_timeout_sec: 90
fees:
  source: upbit_orders_chance
  refresh_interval_sec: 300
  fallback_bid_fee_bps: 5.0
  fallback_ask_fee_bps: 5.0
risk:
  max_risk_per_trade_pct: 0.35
  max_daily_loss_pct: 1.5
  max_weekly_loss_pct: 4.0
  max_position_pct_per_symbol: 20.0
  max_total_exposure_pct: 30.0
  consecutive_loss_cooldown_count: 3
  cooldown_minutes_after_trigger: 180
  min_hold_seconds: 300
cost_guard:
  max_spread_bps_entry: 8.0
  max_predicted_slippage_bps: 10.0
  max_total_cost_bps: 18.0
  min_expected_edge_bps: 28.0
  entry_cost_buffer_bps: 5.0
stop_policy:
  mode: atr_with_hard_stop
  atr_window: 14
  atr_stop_mult: 2.2
  atr_trail_mult: 2.8
  hard_stop_pct: 1.2
  take_profit_partial_pct: 1.8
  time_stop_minutes: 360
  break_even_after_rr: 1.0
  include_tax_in_realtime_stop: false
  include_fee_in_realtime_stop: true
regime:
  trade_allowed:
  - TREND
  blocked:
  - HIGH_VOL
  - DATA_UNSTABLE
  trend_adx_min: 25
  volatility_block_atr_pct: 2.5
signal:
  trend_follow_enabled: true
  timeframe_entry: 15m
  timeframe_context: 1h
  donchian_window: 20
  volume_zscore_min: 1.2
  rsi_min: 50
ops_guard:
  pause_on_ws_reconnects_5m: 5
  pause_on_rest_429_5m: 8
  pause_on_recon_fail: true
  max_data_lag_sec: 3
  max_clock_skew_ms: 1500
  max_fill_latency_sec: 45
resume_policy:
  recon_ok_streak_required: 3
  check_interval_sec: 20
  min_stable_duration_sec: 300
  auto_resume_blocked_reasons:
  - RECON_FAIL
  - DAILY_LOSS
  - MANUAL
settlement:
  timezone: Asia/Seoul
reporting:
  daily_review_time_kst: '23:10'
  weekly_review_day: SUN
  weekly_review_time_kst: '21:00'
llm:
  default:
    enabled: true
    api_style: auto
    model: gpt-5-mini
    reasoning_effort: low
    temperature: 0.2
    timeout_sec: 3600
  agents:
    research_agent:
      model: gpt-5.2
      api_style: responses
      reasoning_effort: xhigh
      temperature: 0.2
    secretary_agent:
      model: gpt-5-nano
