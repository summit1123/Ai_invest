version: "v1.0"
as_of_date: "2026-02-09"

universe:
  market: "upbit"
  # fallback 유니버스(동적 스캔 실패 시 사용)
  symbols:
    - "KRW-BTC"
    - "KRW-ETH"
    - "KRW-XRP"
    - "KRW-SOL"
  # 동적 유니버스: 업비트 API로 KRW 마켓을 스캔해 거래대금 상위 후보를 자동 선정
  dynamic:
    enabled: true
    quote_currency: "KRW"
    top_n_by_24h_turnover: 40
    max_candidates: 12
    min_24h_turnover_krw: 5000000000
    include_symbols: []
    exclude_symbols: []
  trade_side: "long_only"
  mode: "paper"
  max_open_positions: 1

# Paper trading 전용: 초기 현금(원) seed. ledger_entries에 1회(DEPOSIT)로 주입된다.
paper:
  initial_cash_krw: 10000000

scheduling:
  decision_interval_sec: 15
  candle_timeframes:
    - "1m"
    - "15m"
    - "1h"

# 독립 워커 실행 주기(초)
workers:
  research_interval_sec: 3600
  quant_interval_sec: 1800
  risk_interval_sec: 300
  ops_interval_sec: 60

# Quant 사전검증(경량 리플레이) 가정값
quant_backtest:
  lookback_bars: 500
  hold_bars: 24
  base_slippage_bps: 1.0
  spread_penalty_mult: 0.30
  low_liquidity_penalty_bps: 1.2
  fill_ratio: 0.92

strategy:
  alpha_score:
    enabled: true
    entry_alpha: 0.65
    strong_alpha: 0.80
    cooldown_override_alpha: 0.90
    cooldown_override_enabled: true
    base_target_pct: 3.0
    max_target_pct: 5.0
    atr_ref_pct: 1.3
    vol_scale_min: 0.5
    vol_scale_max: 1.2
    ema_fast: 20
    ema_slow: 60
    ret_short_mins: 15
    ret_long_mins: 60
    lookback_minutes: 240
    rev_rsi_prev_max: 32
    rev_rsi_now_min: 50
    rev_ret_15m_max: -0.008
    rev_vol_z_min: 1.3
    exit_rsi: 45
    stop_atr_mult: 1.1
    trail_atr_mult: 0.9
    time_stop_mom_minutes: 240
    time_stop_rev_minutes: 120
    cooldown_minutes: 30
    atr_block_pct: 2.5
    daily_loss_entry_block_ratio: 0.8

paper_mode:
  data_collection:
    enabled: true
    min_trades_for_strict_gate: 30
    relaxed_min_win_rate_pct: 25.0
    relaxed_min_backtest_score: -1.5
    relaxed_min_profit_factor: 1.05
    relaxed_min_expectancy_pct: 0.0
    force_plan_buy_allowed: true
    force_plan_target_pct: 5.0

governance:
  # 정기 회의(1시간 간격). 실시간 트리거(수익/손절/비용/레짐/운영)는 즉시 Safe Judge로 처리하고,
  # 회의는 "종목/비중/허용조건(Trade Plan)"과 "룰 패치 제안"을 갱신하는 거버넌스 용도.
  daily_meeting_times_kst:
    # 24:00은 다음날 00:00과 동일하므로 시스템 저장값은 00:00을 사용
    - "00:00"
    - "01:00"
    - "02:00"
    - "03:00"
    - "04:00"
    - "05:00"
    - "06:00"
    - "07:00"
    - "08:00"
    - "09:00"
    - "10:00"
    - "11:00"
    - "12:00"
    - "13:00"
    - "14:00"
    - "15:00"
    - "16:00"
    - "17:00"
    - "18:00"
    - "19:00"
    - "20:00"
    - "21:00"
    - "22:00"
    - "23:00"
  # 회의 시작 전, 에이전트 사전업무 리포트 허용 최대 나이(분)
  prework_max_age_min: 360
  # 사전업무 리프레시 재시도 최소 간격(분, 슬롯 단위)
  prework_refresh_cooldown_min: 5
  # true면 사전업무 리포트가 없거나 stale일 때 회의를 fail-closed로 중단
  require_prework_reports: true
  # 슬롯 시간 기준으로 +/- 몇 분까지를 “해당 회의 시간대”로 볼지(중복 생성 방지)
  meeting_window_min: 5
  # 재시작 후 누락된 정기 슬롯을 자동 보강할지 여부
  catchup_enabled: true
  # 보강 대상 최대 과거 범위(시간)
  catchup_lookback_hours: 36
  # 회의 결과로 기본 채택할 목표 비중(실행은 Safe Judge 게이트 통과 시에만)
  default_target_position_pct: 10.0
  # 정책/플랜 활성화 게이트: 사전검증 미통과 시 ACTIVE 반영 금지(FAIL-CLOSED)
  activation_gate:
    enabled: true
    # LIVE 분기 준비는 하되 기본은 비활성(현재는 PAPER/HOLD 자동운용)
    live_execution_enabled: false
    conditional_activation:
      enabled: true
      auto_promote_to: "PAPER"
      conditions:
        min_alpha: 0.75
        max_spread_bps: 1.5
        min_vol_z: 0.0
        min_atr_pct: 0.08
        sustain_seconds: 180
        min_pass_conditions: 3
      promotion:
        target_position_pct_cap: 3.0
        cooldown_after_promotion_minutes: 60
        promotion_ttl_minutes: 120
    require_symbol_match: true
    min_backtest_trades: 3
    min_win_rate_pct: 40.0
    min_backtest_score: 0.0
    max_drawdown_pct: 25.0
  # 자본(에쿼티) 규모별 비중/상한/쿨다운 정책.
  # - 회의 플랜(target_position_pct)과 실시간 실행 비중 모두 이 상한을 넘지 않도록 적용된다.
  # - min_equity_krw 이상 조건 중 가장 큰 티어를 선택한다.
  capital_policy:
    enabled: true
    tiers:
      - name: "seed_small"
        min_equity_krw: 0
        max_target_position_pct: 6.0
        max_position_pct_per_symbol: 12.0
        cooldown_minutes_after_trigger: 240
      - name: "core"
        min_equity_krw: 3000000
        max_target_position_pct: 10.0
        max_position_pct_per_symbol: 18.0
        cooldown_minutes_after_trigger: 180
      - name: "expanded"
        min_equity_krw: 10000000
        max_target_position_pct: 12.0
        max_position_pct_per_symbol: 20.0
        cooldown_minutes_after_trigger: 120

execution:
  order_style: "limit_post_only_first"
  default_ord_type: "limit"
  default_time_in_force: "post_only"
  post_only_timeout_sec: 30
  reprice_interval_sec: 8
  max_reprice_count: 3
  fallback_to_market: false
  min_order_krw: 10000
  max_submit_retries: 2
  cancel_on_timeout_sec: 90

fees:
  source: "upbit_orders_chance"
  refresh_interval_sec: 300
  fallback_bid_fee_bps: 5.0
  fallback_ask_fee_bps: 5.0

risk:
  max_risk_per_trade_pct: 0.35
  max_daily_loss_pct: 1.50
  max_weekly_loss_pct: 4.00
  max_position_pct_per_symbol: 20.0
  max_total_exposure_pct: 30.0
  consecutive_loss_cooldown_count: 3
  cooldown_minutes_after_trigger: 180
  min_hold_seconds: 300

cost_guard:
  max_spread_bps_entry: 8.0
  max_predicted_slippage_bps: 10.0
  max_total_cost_bps: 18.0
  min_expected_edge_bps: 28.0
  entry_cost_buffer_bps: 5.0

stop_policy:
  mode: "atr_with_hard_stop"
  atr_window: 14
  atr_stop_mult: 2.2
  atr_trail_mult: 2.8
  hard_stop_pct: 1.2
  take_profit_partial_pct: 1.8
  time_stop_minutes: 360
  break_even_after_rr: 1.0
  include_tax_in_realtime_stop: false
  include_fee_in_realtime_stop: true

regime:
  trade_allowed:
    - "TREND"
  blocked:
    - "HIGH_VOL"
    - "DATA_UNSTABLE"
  trend_adx_min: 25
  volatility_block_atr_pct: 2.5

signal:
  trend_follow_enabled: true
  timeframe_entry: "15m"
  timeframe_context: "1h"
  donchian_window: 20
  volume_zscore_min: 1.2
  rsi_min: 50

ops_guard:
  pause_on_ws_reconnects_5m: 5
  pause_on_rest_429_5m: 8
  pause_on_recon_fail: true
  max_data_lag_sec: 3
  max_clock_skew_ms: 1500
  max_fill_latency_sec: 45

resume_policy:
  recon_ok_streak_required: 3
  check_interval_sec: 20
  min_stable_duration_sec: 300
  auto_resume_blocked_reasons:
    - "RECON_FAIL"
    - "DAILY_LOSS"
    - "MANUAL"

settlement:
  timezone: "Asia/Seoul"

reporting:
  # 일일 리뷰 알림 전송 시각(KST)
  daily_review_time_kst: "23:10"
  # 주간 리뷰 알림(week window: 월~일)
  weekly_review_day: "SUN"
  weekly_review_time_kst: "21:00"

# LLM 라우팅(Agent별 모델/성능/엔드포인트). 실행 경로(Safe Judge/주문)는 LLM에 의존하지 않는다.
llm:
  default:
    enabled: true
    api_style: "auto"   # auto|responses|chat
    model: "gpt-5-mini"
    reasoning_effort: "low"
    temperature: 0.2
    timeout_sec: 45
  agents:
    research_agent:
      model: "gpt-5.2"
      api_style: "responses"
      reasoning_effort: "xhigh"
      temperature: 0.2
      timeout_sec: 60
    secretary_agent:
      model: "gpt-5-nano"
      api_style: "responses"
      reasoning_effort: "low"
      temperature: 0.2
      timeout_sec: 60
    strategy_coordinator:
      model: "gpt-5.2"
      api_style: "responses"
      reasoning_effort: "xhigh"
      temperature: 0.2
      timeout_sec: 90
    # 주간 우선순위(차주 계획) 전용: 고품질 모델
    strategy_coordinator_weekly:
      model: "gpt-5.2-pro"
      api_style: "responses"
      reasoning_effort: "xhigh"
      temperature: 0.1
      timeout_sec: 180
    # 월말 정산/검증 전용: 월 1회 고품질 모델
    finance_tax_agent:
      model: "gpt-5.2-pro"
      api_style: "responses"
      reasoning_effort: "xhigh"
      temperature: 0.1
      timeout_sec: 240
    governance_research_agent:
      model: "gpt-5.2"
      api_style: "responses"
      reasoning_effort: "medium"
      temperature: 0.2
      timeout_sec: 90
    governance_quant_strategist:
      model: "gpt-5.2"
      api_style: "responses"
      reasoning_effort: "medium"
      temperature: 0.2
      timeout_sec: 120
    governance_risk_manager:
      model: "gpt-5.2"
      api_style: "responses"
      reasoning_effort: "medium"
      temperature: 0.1
      timeout_sec: 90
    governance_ops_manager:
      model: "gpt-5-mini"
      api_style: "responses"
      reasoning_effort: "medium"
      temperature: 0.1
      timeout_sec: 60
    governance_coordinator:
      model: "gpt-5.2"
      api_style: "responses"
      reasoning_effort: "medium"
      temperature: 0.1
      timeout_sec: 180
    governance_secretary:
      model: "gpt-5-nano"
      api_style: "responses"
      reasoning_effort: "medium"
      temperature: 0.2
      timeout_sec: 60
