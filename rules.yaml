    strategy_coordinator:
      model: gpt-5.2
      api_style: responses
      reasoning_effort: xhigh
      temperature: 0.2
    strategy_coordinator_weekly:
      model: gpt-5.2-pro
      api_style: responses
      reasoning_effort: xhigh
      temperature: 0.1
    finance_tax_agent:
      model: gpt-5.2-pro
      api_style: responses
      reasoning_effort: xhigh
      temperature: 0.1
    governance_research_agent:
      model: gpt-5.2
      api_style: responses
