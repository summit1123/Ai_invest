      temperature: 0.2
    governance_quant_strategist:
      model: gpt-5.2
      api_style: responses
      reasoning_effort: medium
      temperature: 0.2
    governance_risk_manager:
      model: gpt-5.2
      api_style: responses
      reasoning_effort: medium
