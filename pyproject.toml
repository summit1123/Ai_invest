[project]
name = "ai-invest"
version = "0.1.0"
description = "AI auto-invest (PnL-first) prototype"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "PyYAML>=6.0,<7",
  "requests>=2.31,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "jsonschema>=4,<5",
  "pygments>=2.17,<3",
  "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
addopts = "--capture=sys"
testpaths = ["tests"]
